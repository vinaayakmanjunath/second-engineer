# Single source of run settings. Validated by secondeng.settings (pydantic).
seed: 42
raw_root: data/raw
landing_root: landing
lake_root: lake            # local folder; the layer layout is identical on abfs:// or s3://
warehouse: lake/warehouse.duckdb
ground_truth: data/ground_truth/injections.json   # read only by evaluate.py
site_data: site/data

# Virtual fleet: one real ship (ARC Gloria) split into contiguous voyage legs.
# Each vessel's first leg is shifted (whole days) to start on replay_start.
fleet:
  replay_start: "2026-09-01"
  vessels:
    - vessel_id: GLORIA-A
      owner: owner_north
      logger: gloria_v1
      legs: ["8 AL 11-09-2025", "12 AL 18-09-2025", "19 AL 29-09-2025", "30-09 AL 06-10-2025"]
    - vessel_id: GLORIA-B
      owner: owner_north
      logger: gloria_v2          # simulated second logger: renamed tags, imperial units, UTC clock
      legs: ["6 AL 14-10-2025", "14 AL 19-10-2025", "21 AL 29-10-2025"]
    - vessel_id: GLORIA-C
      owner: owner_south
      logger: gloria_v1
      legs: ["6 AL 30-11-2025", "1 AL 19-12-2025"]

# Fault injection (ground truth written to data/ground_truth, never read by the pipeline).
injection:
  vessel_id: GLORIA-C
  fault: air_cooler_fouling  # largest exhaust-temp shift; exhaust is measured on all 6 cylinders
  ramp_hours: 96
  severity_x_bench: 3.0    # deviation at failure as a multiple of the bench-measured deviation (see docs/sensitivity.md)
  failure_offset_days: 25  # declared failure = vessel's first replay timestamp + this many days
  noise_frac: 0.002

# Ship-to-shore transport simulation.
simulator:
  batch_minutes: 15
  duplicate_rate: 0.02
  late_rate: 0.05
  late_hours: [1, 12]
  out_of_order_row_rate: 0.01
  corrupt_row_rate: 0.0005
  outages_per_vessel: 2
  outage_hours: [4, 18]
  send_delay_minutes: [1, 5]

# Detection (gold). Thresholds set once; see docs/decisions.md.
detection:
  running_frac_of_p99_rpm: 0.5    # running = rpm above this share of the system's p99 rpm ...
  running_min_minutes: 5          # ... for at least this many consecutive minutes
  baseline_days: 10               # learn "normal" from each system's first N days of running
  baseline_min_hours: 24          # a sensor needs this many running hours to get a baseline
  unscored_measurements: [speed, sw_out_temp]  # load proxy; sea-temperature driven
  sigma_floor_frac: 0.01          # robust sigma >= 1% of the sensor's median (quantised sensors)
  z_threshold: 3.0
  min_sensors: 3                  # sensors of one system at |z| >= z_threshold in the same hour
  alert_min_hours: 3              # flagged hours before an alert opens
  alert_close_hours: 3            # flagged hours further apart than this start a new alert
  health_k: 10                    # health = 100 - clamp(mean |z| * k)
  match_min: 0.8                  # fault match below this cosine similarity = "no confident match"

# Off-hire cost model: illustrative assumptions, not a pricing model; labelled so everywhere shown.
cost_model:
  offhire_usd: 36000
  opex_per_day_usd: 7500
  offhire_days: 1.5
  offhire_bunkers_usd: 9600
  severity_weight: {high: 1.0, medium: 0.5, low: 0.2}
