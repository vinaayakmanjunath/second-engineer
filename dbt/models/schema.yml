version: 2
seeds:
  - name: sensor_registry
    description: Canonical sensors (generated from config/sensors.yaml).
    columns:
      - name: sensor_id
        tests: [unique, not_null]
  - name: fleet
    description: Virtual vessels and owners (generated from config/settings.yaml).
    columns:
      - name: vessel_id
        tests: [unique, not_null]
  - name: fault_signatures
    description: Bench fault signatures, mean relative deviation per measurement (generated).

models:
  - name: stg_points
    columns:
      - name: sensor_id
        tests:
          - relationships:
              arguments: {to: ref('sensor_registry'), field: sensor_id}
      - name: ts_utc
        tests: [not_null]
  - name: mart_rollup_1min
    description: 1-minute min/mean/max/count per vessel x sensor (incremental).
    columns:
      - name: minute
        tests: [not_null]
  - name: int_operating_state
    columns:
      - name: state
        tests:
          - accepted_values:
              arguments: {values: [running, idle, 'off']}
  - name: mart_baselines
    columns:
      - name: sigma
        description: Robust sigma used for z, = max(robust_sigma, sigma_floor_frac x |median|).
        tests: [not_null]
      - name: robust_sigma
        description: 1.4826 x MAD of the residuals over the baseline window.
      - name: sigma_source
        description: Which term set sigma, 'mad' or 'floor' (the floor binds for quantised or very steady sensors).
      - name: n_hours
        description: Running hours in the baseline window the line was fitted on.
  - name: mart_alerts
    columns:
      - name: alert_id
        tests: [unique, not_null]
      - name: severity
        tests:
          - accepted_values:
              arguments: {values: [high, medium, low]}
      - name: status
        tests:
          - accepted_values:
              arguments: {values: [open, closed]}
  - name: mart_fault_match
    columns:
      - name: similarity
        description: Cosine similarity between the alert's median relative deviation and a bench fault signature.
      - name: confident
        description: similarity >= match_min; the only place this cut-off is applied (dashboard and API read it).
      - name: margin
        description: Rank-1 similarity minus rank-2 (rank 1 rows only); small = the top two faults look alike.
      - name: alert_id
        tests:
          - relationships:
              arguments: {to: ref('mart_alerts'), field: alert_id}
  - name: mart_fleet
    columns:
      - name: vessel_id
        tests: [unique, not_null]
