[project]
name = "secondeng"
version = "0.1.0"
description = "Second Engineer: early engine-fault warnings from messy ship telemetry (open-data demo)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.1",
    "dbt-duckdb>=1.8",
    "pydantic>=2.6",
    "pyyaml>=6",
    "openpyxl>=3.1",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
secondeng = "secondeng.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondeng"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
